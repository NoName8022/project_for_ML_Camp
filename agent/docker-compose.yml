services:

  student-ai-agent:
    build: .
    container_name: student-ai-agent
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  student-ai-agent-cli:
    build: .
    container_name: student-ai-agent-cli
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    stdin_open: true
    tty: true
    command: python main.py

volumes:
  hf_cache: